<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lot Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lot Inventory</h1>
    <p id="lot-headline"></p>
    <p class="note" id="lot-condition"></p>
    <ul class="terms" id="lot-terms"></ul>
  </header>
  <main id="items"></main>
  <footer>
    <p>Questions about an item? Ask and reference the item name.</p>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close photo viewer">&times;</button>
    <div class="lb-title" id="lb-title"></div>
    <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous photo">&#10094;</button>
    <img id="lb-img" alt="">
    <button class="lb-arrow lb-next" id="lb-next" aria-label="Next photo">&#10095;</button>
    <div class="lb-counter" id="lb-counter"></div>
  </div>

  <script src="site-data.js"></script>
  <script>
    const esc = (text) => String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    document.getElementById('lot-headline').textContent = LOT_INFO.headline;
    document.getElementById('lot-condition').textContent = LOT_INFO.condition_blanket;
    document.getElementById('lot-terms').innerHTML =
      LOT_INFO.terms.map((t) => `<li>${esc(t)}</li>`).join('');

    const linkify = (text) => esc(text).replace(/https?:\/\/[^\s<]+/g,
      (u) => `<a href="${u}" target="_blank" rel="noreferrer noopener">${u}</a>`);
    const renderSpec = (spec) => `<li><strong>${esc(spec.key)}</strong>: ${linkify(spec.value)}</li>`;
    const renderBook = (book) => book.url
      ? `<li><a href="${esc(book.url)}" target="_blank" rel="noreferrer noopener">${esc(book.title)}</a></li>`
      : `<li>${esc(book.title)}</li>`;
    const renderPhoto = (item, photo, index) => `
      <button type="button" class="photo-thumb" data-item="${esc(item.id)}" data-index="${index}"
              aria-label="Open photo ${index + 1} of ${item.photos.length} for ${esc(item.title)}">
        <img src="${esc(photo.src)}" alt="${esc(photo.alt)}" loading="lazy">
      </button>`;

    const section = (title, body) =>
      body ? `<div class="item-section"><h3>${title}</h3>${body}</div>` : '';

    const renderItem = (item) => {
      const qty = item.quantity > 1 ? ` <span class="qty">× ${item.quantity}</span>` : '';
      const books = section('Included titles',
        item.books.length ? `<ul class="book-list">${item.books.map(renderBook).join('')}</ul>` : '');
      const specs = section('Key details',
        item.specs.length ? `<ul class="spec-list">${item.specs.map(renderSpec).join('')}</ul>` : '');
      const photos = section('Photos',
        item.photos.length
          ? `<div class="photo-grid">${item.photos.map((p, i) => renderPhoto(item, p, i)).join('')}</div>`
          : '');
      return `
        <article id="item-${esc(item.id)}" class="inventory-item">
          <details>
            <summary>
              <span class="item-title">${esc(item.title)}${qty}</span>
              <span class="meta">${esc(item.category)}</span>
            </summary>
            <div class="item-body">
              <p class="condition">${esc(item.condition)}</p>
              ${item.info_url ? `<p class="info-link"><a href="${esc(item.info_url)}" target="_blank" rel="noreferrer noopener">More info</a></p>` : ''}
              ${books}
              ${specs}
              ${photos}
            </div>
          </details>
        </article>
      `;
    };

    document.getElementById('items').innerHTML = LOT_ITEMS.map(renderItem).join('');

    // ---- Lightbox ----
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbTitle = document.getElementById('lb-title');
    const lbCounter = document.getElementById('lb-counter');
    const lbPrev = document.getElementById('lb-prev');
    const lbNext = document.getElementById('lb-next');
    const lbClose = document.getElementById('lb-close');

    let lbItem = null;
    let lbIndex = 0;
    let lastFocus = null;

    const preload = (src) => { const im = new Image(); im.src = src; };

    const renderLightbox = () => {
      const photos = lbItem.photos;
      const photo = photos[lbIndex];
      lbImg.src = photo.src;
      lbImg.alt = photo.alt;
      lbTitle.textContent = lbItem.title;
      lbCounter.textContent = `${lbIndex + 1} / ${photos.length}`;
      const single = photos.length < 2;
      lbPrev.hidden = single;
      lbNext.hidden = single;
      if (!single) {
        preload(photos[(lbIndex + 1) % photos.length].src);
        preload(photos[(lbIndex - 1 + photos.length) % photos.length].src);
      }
    };

    const openLightbox = (itemId, index) => {
      lbItem = LOT_ITEMS.find((i) => i.id === itemId);
      if (!lbItem || !lbItem.photos.length) return;
      lbIndex = index;
      lastFocus = document.activeElement;
      renderLightbox();
      lb.hidden = false;
      document.body.classList.add('lb-open');
      lbClose.focus();
    };

    const closeLightbox = () => {
      lb.hidden = true;
      lbImg.src = '';
      document.body.classList.remove('lb-open');
      if (lastFocus) lastFocus.focus();
    };

    const step = (delta) => {
      const n = lbItem.photos.length;
      lbIndex = (lbIndex + delta + n) % n;
      renderLightbox();
    };

    document.getElementById('items').addEventListener('click', (e) => {
      const thumb = e.target.closest('.photo-thumb');
      if (thumb) openLightbox(thumb.dataset.item, Number(thumb.dataset.index));
    });

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
    lbNext.addEventListener('click', (e) => { e.stopPropagation(); step(1); });
    lb.addEventListener('click', (e) => {
      if (e.target === lb) closeLightbox();  // backdrop tap/click
    });

    document.addEventListener('keydown', (e) => {
      if (lb.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });

    // Touch/pointer swipe
    let swipeX = null;
    lb.addEventListener('pointerdown', (e) => { swipeX = e.clientX; });
    lb.addEventListener('pointerup', (e) => {
      if (swipeX === null) return;
      const dx = e.clientX - swipeX;
      swipeX = null;
      if (Math.abs(dx) > 40 && lbItem && lbItem.photos.length > 1) {
        step(dx < 0 ? 1 : -1);
      }
    });
  </script>
</body>
</html>
